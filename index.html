<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Oslofjord — kto gdzie mieszka</title>
<meta name="theme-color" content="#014d49">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --brand-900: #014d49;
    --brand-700: #0c625c;
    --brand-500: #3e9f97;
    --brand-200: #d2eeeb;
    --brand-100: #f0fcfa;
    --text: #1e1f21;
    --muted: #6b6e76;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    background: linear-gradient(160deg, var(--brand-900), var(--brand-700));
    color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    z-index: 1001;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  header h1 small { font-weight: 400; opacity: .75; font-size: 12px; margin-left: 6px; }

  .searchbox { position: relative; }
  .searchbox input {
    width: 100%;
    padding: 10px 38px 10px 38px;
    border: 1.5px solid rgba(255,255,255,.22);
    border-radius: 999px;
    font-size: 16px; font-family: inherit;
    background: var(--brand-900);
    color: #fff;
    outline: none;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.12);
  }
  .searchbox input::placeholder {
    color: rgba(255,255,255,.55);
  }
  .searchbox input:focus {
    border-color: rgba(255,255,255,.4);
    background: #013f3b;
  }
  .searchbox .icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: rgba(255,255,255,.65); pointer-events: none;
  }
  .searchbox .clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.18); color: rgba(255,255,255,.85);
    font-size: 15px; line-height: 1; cursor: pointer; display: none;
  }

  #results {
    position: absolute; left: 12px; right: 12px;
    top: calc(env(safe-area-inset-top, 0px) + 104px);
    max-height: 45vh; overflow-y: auto;
    background: #fff; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    z-index: 1002; display: none;
  }
  #results.open { display: block; }
  .result {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid #f0f1f2;
  }
  .result:last-child { border-bottom: none; }
  .result:hover, .result:active { background: var(--brand-100); }
  .result .badge {
    flex-shrink: 0;
    min-width: 42px; padding: 4px 7px;
    border-radius: 10px;
    background: var(--brand-900); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.15; gap: 1px;
  }
  .result .badge .bldg { font-weight: 700; font-size: 14px; }
  .result .badge .aptn {
    font-weight: 600; font-size: 11px; opacity: .85;
    font-variant-numeric: tabular-nums;
  }
  .result .badge.rekketun {
    background: #c47a3a;
    font-size: 12px;
  }
  .result .info { min-width: 0; }
  .result .name { font-weight: 600; font-size: 15px; }
  .result .addr { font-size: 12.5px; color: var(--muted); }
  .result .name b { color: var(--brand-700); background: var(--brand-200); border-radius: 3px; }
  .noresults { padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }

  #map { flex: 1; z-index: 1; }

  /* marker budynku */
  .bldg-icon {
    background: var(--brand-500);
    border: 2.5px solid #fff;
    border-radius: 50%;
    color: #fff; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    transition: transform .15s ease, background .15s ease;
  }
  .bldg-icon.rekketun {
    background: #c47a3a;
    border-radius: 8px;
    font-size: 11px;
    letter-spacing: -0.3px;
  }
  .bldg-icon.active { background: #ed6362; transform: scale(1.25); z-index: 999; }
  .bldg-count {
    position: absolute; top: -7px; right: -7px;
    background: #fff; color: var(--brand-900);
    border: 1.5px solid var(--brand-500);
    border-radius: 999px; min-width: 17px; height: 17px; padding: 0 3px;
    font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .bldg-icon.rekketun .bldg-count { border-color: #c47a3a; color: #8a4f1a; }

  .leaflet-popup-content { margin: 12px 14px; font-family: inherit; }
  .popup-title { font-weight: 700; font-size: 15px; color: var(--brand-900); margin-bottom: 2px; }
  .popup-sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .popup-list { max-height: 200px; overflow-y: auto; }
  .popup-row {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
    padding: 4px 0; font-size: 13.5px;
    border-bottom: 1px dashed #eee;
    transition: background .35s ease, box-shadow .35s ease, transform .35s ease;
  }
  .popup-row .names div { padding: 1px 0; }
  .popup-row .names .hl-name {
    font-weight: 700;
    color: var(--brand-900);
  }
  .popup-row:last-child { border-bottom: none; }
  .popup-row .apt { color: var(--brand-700); font-weight: 700; font-variant-numeric: tabular-nums; }
  .popup-row.hl {
    background: var(--brand-100);
    border-radius: 6px;
    padding-left: 6px; padding-right: 6px;
    margin: 0 -6px;
  }
  .popup-row.hl-pulse {
    animation: hl-pulse 1.6s ease-out 1;
    box-shadow: inset 0 0 0 1.5px var(--brand-500);
  }
  @keyframes hl-pulse {
    0%   { background: #9fd9d3; transform: scale(1.02); }
    40%  { background: var(--brand-200); transform: scale(1.02); }
    100% { background: var(--brand-100); transform: scale(1); }
  }
  .popup-empty { font-size: 13px; color: var(--muted); padding: 4px 0; }

  footer {
    position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    left: 50%; transform: translateX(-50%);
    z-index: 1000;
    background: rgba(255,255,255,.9); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 6px 14px;
    font-size: 12px; color: var(--muted);
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    white-space: nowrap;
  }

  /* ── kawa u sąsiada ── */
  #coffeeBtn,
  #inviteBtn {
    position: absolute;
    left: 14px;
    z-index: 1000;
    width: 58px; height: 58px;
    border: none; border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s cubic-bezier(.2, 1.2, .4, 1), box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
    animation: fab-idle 2.8s ease-in-out infinite;
  }
  #coffeeBtn {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 52px);
    background: linear-gradient(145deg, #7a4a36, #3e2418);
    color: #f5e6d3;
    box-shadow:
      0 4px 18px rgba(62, 36, 24, .45),
      0 0 0 0 rgba(62, 158, 151, .35),
      inset 0 1px 0 rgba(255,255,255,.18);
  }
  #inviteBtn {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 122px);
    background: linear-gradient(145deg, #0c625c, #014d49);
    color: #f0fcfa;
    box-shadow:
      0 4px 18px rgba(1, 77, 73, .4),
      0 0 0 0 rgba(62, 158, 151, .35),
      inset 0 1px 0 rgba(255,255,255,.18);
    animation-delay: .4s;
  }
  #coffeeBtn:hover,
  #inviteBtn:hover { transform: scale(1.08); }
  #coffeeBtn:active,
  #inviteBtn:active { transform: scale(.92); animation: none; }
  #coffeeBtn svg,
  #inviteBtn svg { width: 28px; height: 28px; }
  #coffeeBtn.spinning {
    pointer-events: none;
    animation: coffee-wiggle .28s ease-in-out infinite;
    box-shadow: 0 6px 22px rgba(62, 36, 24, .5), 0 0 0 6px rgba(62, 158, 151, .2);
  }
  @keyframes fab-idle {
    0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 4px 18px rgba(62,36,24,.45), 0 0 0 0 rgba(62,158,151,.0); }
    50% { transform: translateY(-3px) scale(1.03); box-shadow: 0 8px 22px rgba(62,36,24,.4), 0 0 0 8px rgba(62,158,151,.12); }
  }
  @keyframes coffee-wiggle {
    0%, 100% { transform: rotate(-8deg) scale(1.04); }
    50% { transform: rotate(8deg) scale(1.04); }
  }

  #coffeeOverlay {
    position: fixed; inset: 0; z-index: 1100;
    background: rgba(1, 30, 28, .62);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    overflow: hidden;
  }
  #coffeeOverlay.open { display: flex; animation: overlay-in .28s ease; }
  #coffeeOverlay.closing { animation: overlay-out .22s ease forwards; }
  @keyframes overlay-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes overlay-out {
    to { opacity: 0; }
  }

  .coffee-burst {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden;
    z-index: 0;
  }
  .coffee-burst i {
    position: absolute;
    left: 50%; top: 42%;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--p, var(--brand-500));
    opacity: 0;
    animation: burst-fly var(--d, .9s) cubic-bezier(.15, .8, .2, 1) forwards;
    animation-delay: var(--delay, 0s);
  }
  .coffee-burst .crumb {
    position: absolute;
    left: var(--left, 50%);
    top: -14%;
    font-size: var(--size, 28px);
    line-height: 1;
    opacity: 0;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.28));
    animation: confetti-fall var(--d, 2.8s) cubic-bezier(.2, .7, .3, 1) forwards;
    animation-delay: var(--delay, 0s);
    will-change: transform, opacity;
  }
  @keyframes burst-fly {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.2);
    }
  }
  @keyframes confetti-fall {
    0% {
      opacity: 0;
      transform: translate3d(0, -20px, 0) rotate(var(--r0, 0deg)) scale(.85);
    }
    8% { opacity: 1; }
    75% { opacity: 1; }
    100% {
      opacity: 0;
      transform: translate3d(var(--dx, 0px), 118vh, 0) rotate(var(--r1, 220deg)) scale(1.05);
    }
  }

  .coffee-card {
    position: relative;
    z-index: 1;
    width: min(360px, 100%);
    background:
      radial-gradient(120% 80% at 50% -20%, rgba(62, 159, 151, .18), transparent 55%),
      linear-gradient(180deg, #fffef9 0%, #f3ebe0 100%);
    border-radius: 24px;
    padding: 22px 20px 18px;
    box-shadow:
      0 24px 60px rgba(0,0,0,.4),
      0 0 0 1px rgba(255,255,255,.4) inset;
    text-align: center;
    transform-origin: center;
    animation: card-pop .42s cubic-bezier(.2, 1.35, .35, 1);
    will-change: transform;
  }
  @keyframes card-pop {
    from { opacity: 0; transform: scale(.82) translateY(28px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .coffee-card.rekketun {
    background:
      radial-gradient(120% 80% at 50% -20%, rgba(196, 122, 58, .22), transparent 55%),
      linear-gradient(180deg, #fffaf4 0%, #f3e4d0 100%);
  }
  .coffee-card.spinning {
    animation: card-hum .45s ease-in-out infinite;
  }
  @keyframes card-hum {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .coffee-card.win {
    animation: card-win .7s cubic-bezier(.2, 1.4, .3, 1);
  }
  @keyframes card-win {
    0% { transform: scale(.96); }
    35% { transform: scale(1.045); }
    100% { transform: scale(1); }
  }
  .coffee-card.win::after {
    content: "";
    position: absolute; inset: -1px;
    border-radius: 24px;
    pointer-events: none;
    box-shadow: 0 0 0 0 rgba(62, 159, 151, .55);
    animation: win-ring .9s ease-out;
  }
  @keyframes win-ring {
    0% { box-shadow: 0 0 0 0 rgba(62, 159, 151, .5); }
    100% { box-shadow: 0 0 0 22px rgba(62, 159, 151, 0); }
  }

  .coffee-cup {
    width: 48px; height: 48px;
    margin: 0 auto 6px;
    color: #6b3e2e;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.14));
  }
  .coffee-card.spinning .coffee-cup { animation: steam .42s ease-in-out infinite; }
  .coffee-card.win .coffee-cup { animation: cup-cheer .55s cubic-bezier(.2, 1.4, .3, 1); }
  @keyframes steam {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-5px) rotate(2deg); }
  }
  @keyframes cup-cheer {
    0% { transform: scale(1) rotate(0); }
    40% { transform: scale(1.2) rotate(-8deg); }
    70% { transform: scale(1.1) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .coffee-label {
    font-size: 12px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: #8a6a4a; margin-bottom: 12px;
  }
  .coffee-status {
    font-size: 13px; font-weight: 600; color: var(--brand-700);
    min-height: 1.2em; margin-bottom: 8px;
    transition: opacity .15s ease, transform .15s ease;
  }
  .coffee-status.pulse { animation: status-pop .25s ease; }
  @keyframes status-pop {
    from { opacity: .4; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .coffee-reel-wrap {
    position: relative;
    height: 96px;
    margin: 0 0 12px;
    border-radius: 16px;
    background: linear-gradient(180deg, #e8f5f3, #dff0ed);
    box-shadow: inset 0 2px 8px rgba(1, 77, 73, .1);
    overflow: hidden;
  }
  .coffee-card.rekketun .coffee-reel-wrap {
    background: linear-gradient(180deg, #f7ebe0, #f0dfc8);
  }
  .coffee-reel-wrap::before,
  .coffee-reel-wrap::after {
    content: "";
    position: absolute; left: 0; right: 0; z-index: 2;
    height: 28px; pointer-events: none;
  }
  .coffee-reel-wrap::before {
    top: 0;
    background: linear-gradient(180deg, rgba(232,245,243,.95), transparent);
  }
  .coffee-reel-wrap::after {
    bottom: 0;
    background: linear-gradient(0deg, rgba(223,240,237,.95), transparent);
  }
  .coffee-card.rekketun .coffee-reel-wrap::before {
    background: linear-gradient(180deg, rgba(247,235,224,.95), transparent);
  }
  .coffee-card.rekketun .coffee-reel-wrap::after {
    background: linear-gradient(0deg, rgba(240,223,200,.95), transparent);
  }
  .coffee-reel-window {
    position: absolute;
    left: 10px; right: 10px; top: 50%;
    height: 40px; margin-top: -20px;
    border-radius: 10px;
    border: 2px solid rgba(1, 77, 73, .22);
    box-shadow: 0 0 0 1px rgba(255,255,255,.5) inset;
    z-index: 3; pointer-events: none;
  }
  .coffee-card.win .coffee-reel-window {
    border-color: var(--brand-500);
    animation: window-glow .8s ease;
  }
  @keyframes window-glow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,.5) inset, 0 0 0 0 rgba(62,159,151,.4); }
    40% { box-shadow: 0 0 0 1px rgba(255,255,255,.5) inset, 0 0 16px 2px rgba(62,159,151,.45); }
  }
  .coffee-reel {
    position: absolute; left: 0; right: 0; top: 0;
    will-change: transform;
  }
  .coffee-reel.blur { filter: blur(1.2px); }
  .coffee-reel-item {
    height: 40px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
    padding: 0 12px;
  }
  .coffee-reel-item .suite {
    font-size: 22px; font-weight: 800; color: var(--brand-900);
    letter-spacing: .02em; line-height: 1.1;
  }
  .coffee-card.rekketun .coffee-reel-item .suite { color: #8a4f1a; }
  .coffee-reel-item .who {
    font-size: 12px; color: var(--muted);
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .coffee-reel-item.winner .suite {
    animation: suite-land .55s cubic-bezier(.2, 1.5, .3, 1);
  }
  @keyframes suite-land {
    0% { transform: scale(1.35); }
    55% { transform: scale(.94); }
    100% { transform: scale(1); }
  }

  .coffee-people {
    text-align: left;
    background: rgba(255,255,255,.72);
    border-radius: 14px;
    padding: 0 14px;
    margin-bottom: 14px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .45s cubic-bezier(.2, 1, .3, 1), opacity .3s ease, padding .3s ease;
  }
  .coffee-people.show {
    max-height: 160px;
    opacity: 1;
    padding: 12px 14px;
  }
  .coffee-people .addr {
    font-size: 12.5px; color: var(--muted); margin-bottom: 6px;
  }
  .coffee-people .names {
    font-size: 15px; font-weight: 600; color: var(--text);
    line-height: 1.45;
  }
  .coffee-actions {
    display: flex; flex-direction: column; gap: 8px;
  }
  .coffee-actions button {
    border: none; border-radius: 999px;
    padding: 12px 16px;
    font-family: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: transform .15s cubic-bezier(.2, 1.2, .4, 1), opacity .2s ease, background .2s ease;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .coffee-actions button svg {
    width: 18px; height: 18px;
    flex-shrink: 0;
  }
  .coffee-actions #coffeeShow {
    font-size: 14px;
    font-weight: 500;
    padding: 10px 14px;
    color: var(--muted);
    border-color: #e6e7e9;
  }
  .coffee-actions.ready button:not([hidden]) {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .coffee-actions.ready button:nth-child(1) { transition-delay: .05s; }
  .coffee-actions.ready button:nth-child(2) { transition-delay: .1s; }
  .coffee-actions.ready button:nth-child(3) { transition-delay: .15s; }
  .coffee-actions.ready button:nth-child(4) { transition-delay: .2s; }
  .coffee-actions.ready button:nth-child(5) { transition-delay: .25s; }
  .coffee-actions button:active { transform: scale(.97); }
  .coffee-actions .primary {
    background: linear-gradient(160deg, var(--brand-700), var(--brand-900));
    color: #fff;
    box-shadow: 0 4px 14px rgba(1, 77, 73, .28);
  }
  .coffee-actions #coffeeDraw {
    background: linear-gradient(160deg, #7a4a36, #3e2418);
    color: #f5e6d3;
    box-shadow: 0 4px 14px rgba(62, 36, 24, .35);
    font-size: 16px;
    padding: 14px 16px;
  }
  .coffee-actions #coffeeDraw:not(:disabled) {
    animation: draw-pulse 1.6s ease-in-out infinite;
  }
  @keyframes draw-pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 4px 14px rgba(62, 36, 24, .35); }
    50% { transform: scale(1.03); box-shadow: 0 6px 20px rgba(62, 36, 24, .45); }
  }
  .coffee-actions .secondary {
    background: transparent; color: var(--brand-700);
    border: 1.5px solid var(--brand-200);
  }
  .coffee-actions .share {
    background: linear-gradient(160deg, #7a4a36, #4a2a1a);
    color: #f5e6d3;
  }
  .coffee-actions button:disabled {
    opacity: .4 !important; pointer-events: none !important;
  }
  .coffee-hint {
    margin-top: 10px;
    font-size: 11px; color: var(--muted);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .35s ease .15s, transform .35s ease .15s;
  }
  .coffee-hint.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── zaproszenie ── */
  #inviteOverlay {
    position: fixed; inset: 0; z-index: 1100;
    background: rgba(1, 30, 28, .62);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    overflow: hidden;
  }
  #inviteOverlay.open { display: flex; animation: overlay-in .28s ease; }
  #inviteOverlay.closing { animation: overlay-out .22s ease forwards; }

  .invite-card {
    position: relative;
    z-index: 1;
    width: min(380px, 100%);
    max-height: min(640px, calc(100vh - 48px - env(safe-area-inset-bottom, 0px)));
    display: flex;

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  // ── dane: data.json (edytowane przez bota Telegram) ──
  // GitHub Pages trzyma pliki w CDN ~10 min; bierzemy świeży commit i raw po SHA (~1 min).
  const REPO = "lukaspoloki/oslofjord-domki";
  async function loadResidents() {
    try {
      const commits = await fetch(
        `https://api.github.com/repos/${REPO}/commits?path=data.json&per_page=1`,
        { cache: "no-store", headers: { Accept: "application/vnd.github+json" } },
      ).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const sha = commits[0]?.sha;
      if (!sha) throw new Error("brak commitów");
      return fetch(
        `https://raw.githubusercontent.com/${REPO}/${sha}/data.json`,
        { cache: "no-store" },
      ).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    } catch {
      // lokalny podgląd / awaria API → plik z tego samego hosta
      return fetch("data.json", { cache: "no-store" })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    }
  }
  let BUILDINGS, APARTMENTS;
  try {
    ({ buildings: BUILDINGS, apartments: APARTMENTS } = await loadResidents());
  } catch (e) {
    document.body.innerHTML =
      '<p style="font-family:sans-serif;padding:2rem;color:#b00">Nie można wczytać <b>data.json</b>.' +
      ' Otwórz stronę przez serwer HTTP (np. <code>python3 -m http.server</code>), nie przez file://</p>';
    throw e;
  }

  // ── pomocnicze ──
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "")
                     .replace(/ł/g, "l").replace(/Ł/g, "L").toLowerCase();

  // Rekketun = budynki z prefiksem R (R2, R4, …) — osobne od zwykłych 2, 4, …
  const isRekketun = b => /^R\d+$/i.test(b);
  const bLabel = b => isRekketun(b)
    ? `Rekketun ${b.toUpperCase()}`
    : `Oslofjordveien ${b}`;
  const bShort = b => isRekketun(b) ? b.toUpperCase() : b;

  // mieszkania pogrupowane wg budynku
  const byBuilding = {};
  APARTMENTS.forEach(a => {
    (byBuilding[a.building] = byBuilding[a.building] || []).push(a);
  });
  Object.values(byBuilding).forEach(list => list.sort((a, b) => a.apt.localeCompare(b.apt)));

  // płaska lista osób (do wyszukiwarki)
  const PEOPLE = APARTMENTS.flatMap(a =>
    a.residents.map(name => ({ name, b: a.building, apt: a.apt })));

  const peopleIn = b => (byBuilding[b] || []).reduce((n, a) => n + a.residents.length, 0);

  function matchesQuery(r, nq) {
    if (norm(r.name).includes(nq) || r.apt.startsWith(nq)) return true;
    const b = String(r.b);
    const bl = b.toLowerCase();
    // dokładny budynek: "8" ≠ "r8"
    if (norm(b) === nq || bl === nq) return true;
    if (isRekketun(b)) {
      if (nq === "rekketun" || nq === "r") return true;
      if (nq === `rekketun ${b.slice(1)}` || nq === `rekketun ${bl}`) return true;
    }
    return false;
  }

  // ── mapa ──
  const map = L.map("map", { zoomControl: false });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  const markers = {};
  const bounds = [];

  function popupHtml(b, highlight) {
    const list = byBuilding[b] || [];
    const hlApt = highlight?.apt;
    const hlName = highlight?.name;
    const rows = list.length
      ? list.map(a => {
          const isHl = hlApt && a.apt === hlApt;
          const hl = isHl ? " hl" : "";
          const floor = a.apt.length === 3 ? ` · p. ${a.apt[0]}` : "";
          const names = a.residents.map(n => {
            const mark = isHl && hlName && n === hlName ? ' class="hl-name"' : "";
            return `<div${mark}>${n}</div>`;
          }).join("");
          return `<div class="popup-row${hl}" data-apt="${a.apt}"><span class="names">${names}</span><span class="apt">${a.apt}${floor}</span></div>`;
        }).join("")
      : `<div class="popup-empty">Brak zgłoszonych osób</div>`;
    const type = isRekketun(b) ? "rekketun · Bekkeveien" : "domek · Oslofjordveien";
    return `<div class="popup-title">${bLabel(b)}</div>
            <div class="popup-sub">${type} · ${peopleIn(b)} os. w ${list.length} mieszk.</div>
            <div class="popup-list">${rows}</div>`;
  }

  Object.entries(BUILDINGS).forEach(([b, pos]) => {
    const count = peopleIn(b);
    const size = count ? (isRekketun(b) ? 38 : 34) : (isRekketun(b) ? 28 : 24);
    const kind = isRekketun(b) ? " rekketun" : "";
    const icon = L.divIcon({
      className: "",
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
      html: `<div class="bldg-icon${kind}" id="bldg-${b}" style="width:${size}px;height:${size}px;${count ? "" : "opacity:.45"}">${bShort(b)}${count ? `<span class="bldg-count">${count}</span>` : ""}</div>`
    });
    const m = L.marker([pos.lat, pos.lng], { icon, zIndexOffset: count ? 100 : 0 }).addTo(map);
    m.bindPopup(
      () => popupHtml(b, currentHighlight && currentHighlight.b === b ? currentHighlight : null),
      { maxWidth: 280 },
    );
    m.on("popupclose", () => {
      // Only clear this building — closing it while navigating to another
      // must not wipe the new highlight / active marker.
      const el = document.getElementById("bldg-" + b);
      if (el) el.classList.remove("active");
      if (currentHighlight?.b === b) currentHighlight = null;
    });
    m.on("popupopen", () => {
      if (!currentHighlight || currentHighlight.b !== b) return;
      requestAnimationFrame(() => revealHighlight(m.getPopup().getElement()));
    });
    markers[b] = m;
    bounds.push([pos.lat, pos.lng]);
  });
  map.fitBounds(bounds, { padding: [40, 40] });

  let currentHighlight = null;
  let highlightTimer = null;

  function setActive(b) {
    document.querySelectorAll(".bldg-icon.active").forEach(el => el.classList.remove("active"));
    if (b) {
      const el = document.getElementById("bldg-" + b);
      if (el) el.classList.add("active");
    } else {
      currentHighlight = null;
    }
  }

  function revealHighlight(popupEl) {
    if (!popupEl || !currentHighlight) return;
    const row = popupEl.querySelector(`.popup-row[data-apt="${CSS.escape(currentHighlight.apt)}"]`);
    if (!row) return;
    const list = popupEl.querySelector(".popup-list");
    if (list) {
      const delta = row.getBoundingClientRect().top - list.getBoundingClientRect().top;
      const top = list.scrollTop + delta - list.clientHeight / 2 + row.offsetHeight / 2;
      list.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    }
    row.classList.remove("hl-pulse");
    // restart animation if the same apt is selected again
    void row.offsetWidth;
    row.classList.add("hl-pulse");
    clearTimeout(highlightTimer);
    highlightTimer = setTimeout(() => row.classList.remove("hl-pulse"), 1800);
  }

  function goTo(b, apt, name) {
    const pos = BUILDINGS[b];
    if (!pos) return;
    currentHighlight = apt ? { b, apt, name: name || null } : null;
    setActive(b);
    const marker = markers[b];
    const alreadyOpen = marker.isPopupOpen();
    map.flyTo([pos.lat, pos.lng], 18, { duration: alreadyOpen ? 0.4 : 0.8 });
    setTimeout(() => {
      if (alreadyOpen) {
        marker.setPopupContent(popupHtml(b, currentHighlight));
        revealHighlight(marker.getPopup().getElement());
      } else {
        marker.openPopup();
      }
    }, alreadyOpen ? 200 : 850);
  }

  // ── wyszukiwarka ──
  const input = document.getElementById("search");
  const resultsEl = document.getElementById("results");
  const clearBtn = document.getElementById("clearBtn");

  function render(q) {
    const nq = norm(q.trim());
    clearBtn.style.display = q ? "block" : "none";
    if (!nq) { resultsEl.classList.remove("open"); resultsEl.innerHTML = ""; return; }

    const hits = PEOPLE
      .filter(r => matchesQuery(r, nq))
      .sort((a, b) => a.name.localeCompare(b.name, "pl"))
      .slice(0, 30);

    resultsEl.innerHTML = hits.length
      ? hits.map((r, i) => {
          const idx = norm(r.name).indexOf(nq);
          const nameHtml = idx >= 0
            ? r.name.slice(0, idx) + "<b>" + r.name.slice(idx, idx + q.trim().length) + "</b>" + r.name.slice(idx + q.trim().length)
            : r.name;
          const flat = APARTMENTS.find(a => a.building === r.b && a.apt === r.apt);
          const others = flat.residents.filter(n => n !== r.name);
          const withWhom = others.length ? ` · z: ${others.join(", ")}` : "";
          const badgeCls = isRekketun(r.b) ? "badge rekketun" : "badge";
          const addrPrefix = isRekketun(r.b) ? "Rekketun" : "Oslofjordveien";
          return `<div class="result" data-i="${i}">
              <div class="${badgeCls}" title="${addrPrefix} ${bShort(r.b)}, mieszkanie ${r.apt}">
                <span class="bldg">${bShort(r.b)}</span>
                <span class="aptn">${r.apt}</span>
              </div>
              <div class="info">
                <div class="name">${nameHtml}</div>
                <div class="addr">${addrPrefix} ${bShort(r.b)} · mieszkanie ${r.apt}${withWhom}</div>
              </div>
            </div>`;
        }).join("")
      : `<div class="noresults">Nie znaleziono „${q}”</div>`;
    resultsEl.classList.add("open");

    resultsEl.querySelectorAll(".result").forEach(el => {
      el.addEventListener("click", () => {
        const r = hits[+el.dataset.i];
        resultsEl.classList.remove("open");
        input.blur();
        goTo(r.b, r.apt, r.name);
      });
    });
  }

  input.addEventListener("input", () => render(input.value));
  input.addEventListener("focus", () => render(input.value));
  clearBtn.addEventListener("click", () => { input.value = ""; render(""); input.focus(); });
  map.on("click", () => resultsEl.classList.remove("open"));

  // ── statystyki ──
  const nBuildings = Object.keys(byBuilding).length;
  document.getElementById("stats").textContent =
    `${PEOPLE.length} osób · ${APARTMENTS.length} mieszkań · ${nBuildings} budynków`;

  // ── kawa u sąsiada — slot machine ──
  const coffeeSuites = APARTMENTS.filter(a => a.residents.length > 0);
  const coffeeBtn = document.getElementById("coffeeBtn");
  const coffeeOverlay = document.getElementById("coffeeOverlay");
  const coffeeCard = document.getElementById("coffeeCard");
  const coffeeReel = document.getElementById("coffeeReel");
  const coffeeStatus = document.getElementById("coffeeStatus");
  const coffeePeople = document.getElementById("coffeePeople");
  const coffeeAddr = document.getElementById("coffeeAddr");
  const coffeeNames = document.getElementById("coffeeNames");
  const coffeeActions = document.getElementById("coffeeActions");
  const coffeeDraw = document.getElementById("coffeeDraw");
  const coffeeShow = document.getElementById("coffeeShow");
  const coffeeShare = document.getElementById("coffeeShare");
  const coffeeAgain = document.getElementById("coffeeAgain");
  const coffeeClose = document.getElementById("coffeeClose");
  const coffeeHint = document.getElementById("coffeeHint");
  const coffeeBurst = document.getElementById("coffeeBurst");

  const REEL_ITEM_H = 40;
  const REEL_PAD = 28; // top padding so first item centers in 96px window
  const SPIN_PHRASES = [
    "Mieszam ziarna…",
    "Szukam sąsiada…",
    "Prawie…",
    "Jeszcze trochę…",
    "To może być ono…",
  ];
  const WIN_PHRASES = [
    "To jest to!",
    "Idź na kawę!",
    "Twój sąsiad czeka!",
    "Jackpot kawowy!",
  ];

  let coffeePick = null;
  let coffeeRaf = 0;
  let coffeeSpinning = false;
  let coffeeAudio = null;

  function ensureAudio() {
    if (coffeeAudio) return coffeeAudio;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    coffeeAudio = new Ctx();
    return coffeeAudio;
  }

  function playTone(freq, dur, type = "sine", gain = 0.04) {
    const ctx = ensureAudio();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
  }

  function buzz(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function pickCoffeeSuite(exclude) {
    if (!coffeeSuites.length) return null;
    if (coffeeSuites.length === 1) return coffeeSuites[0];
    let next;
    do {
      next = coffeeSuites[Math.floor(Math.random() * coffeeSuites.length)];
    } while (
      exclude &&
      next.building === exclude.building &&
      next.apt === exclude.apt
    );
    return next;
  }

  function suiteLabel(a) {
    return `${bShort(a.building)} / ${a.apt}`;
  }

  function hostLine(a) {
    if (a.residents.length === 1) return a.residents[0];
    if (a.residents.length === 2) return a.residents.join(" & ");
    return `${a.residents[0]} + ${a.residents.length - 1}`;
  }

  function setStatus(text, pulse = true) {
    coffeeStatus.textContent = text;
    if (!pulse) return;
    coffeeStatus.classList.remove("pulse");
    void coffeeStatus.offsetWidth;
    coffeeStatus.classList.add("pulse");
  }

  function setResultButtons(visible) {
    coffeeDraw.hidden = visible;
    coffeeShow.hidden = !visible;
    coffeeAgain.hidden = !visible;
    coffeeShare.hidden = !visible;
  }

  function setCoffeeBusy(busy) {
    coffeeSpinning = busy;
    coffeeBtn.classList.toggle("spinning", busy);
    coffeeCard.classList.toggle("spinning", busy);
    coffeeDraw.disabled = busy;
    coffeeAgain.disabled = busy;
    coffeeShow.disabled = busy || !coffeePick;
    coffeeShare.disabled = busy || !coffeePick;
    if (busy) coffeeActions.classList.remove("ready");
  }

  function showIdleReel() {
    const sample = coffeeSuites[0] || null;
    if (!sample) {
      coffeeReel.innerHTML = `<div class="coffee-reel-item"><div class="suite">—</div><div class="who">Brak mieszkań</div></div>`;
    } else {
      coffeeReel.innerHTML = `<div class="coffee-reel-item">
        <div class="suite">? / ???</div>
        <div class="who">Naciśnij Losuj</div>
      </div>`;
    }
    coffeeReel.style.transform = `translate3d(0, ${REEL_PAD}px, 0)`;
    coffeeReel.classList.remove("blur");
  }

  function resetCoffeeModal() {
    cancelAnimationFrame(coffeeRaf);
    coffeePick = null;
    coffeeCard.classList.remove("win", "spinning", "rekketun");
    coffeePeople.classList.remove("show");

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function easeOutQuint(t) {
    return 1 - Math.pow(1 - t, 5);

  function buildReel(strip, winnerIndex) {
    coffeeReel.innerHTML = strip.map((a, i) => {
      const win = i === winnerIndex ? " winner" : "";
      return `<div class="coffee-reel-item${win}">
        <div class="suite">${suiteLabel(a)}</div>

  const CONFETTI_BITS = ["☕", "🍪", "🫘", "☕", "🍪", "🍩", "☕", "🍪"];

  function fireBurst(rekketun) {
    coffeeBurst.innerHTML = "";
    const colors = rekketun
      ? ["#c47a3a", "#e8b07a", "#8a4f1a", "#f0d0a0", "#3e9f97"]
      : ["#3e9f97", "#014d49", "#9fd9d3", "#6b3e2e", "#f5e6d3", "#c4a484"];

    // mały wybuch wokół karty
    for (let i = 0; i < 22; i++) {
      const el = document.createElement("i");
      const angle = (Math.PI * 2 * i) / 22 + Math.random() * 0.35;
      const dist = 80 + Math.random() * 160;
      el.style.setProperty("--x", `${Math.cos(angle) * dist}px`);
      el.style.setProperty("--y", `${Math.sin(angle) * dist - 30}px`);
      el.style.setProperty("--p", colors[i % colors.length]);
      el.style.setProperty("--d", `${0.75 + Math.random() * 0.45}s`);
      el.style.setProperty("--delay", `${Math.random() * 0.1}s`);
      el.style.width = `${5 + Math.random() * 7}px`;
      el.style.height = el.style.width;
      if (Math.random() > 0.5) el.style.borderRadius = "2px";
      coffeeBurst.appendChild(el);
    }

    // deszcz kawowo-ciasteczkowy w tle
    const n = 64;
    for (let i = 0; i < n; i++) {
      const el = document.createElement("span");
      el.className = "crumb";
      el.textContent = CONFETTI_BITS[i % CONFETTI_BITS.length];

      el.style.setProperty("--left", `${left}%`);
      el.style.setProperty("--dx", `${drift}px`);

      el.style.setProperty("--r1", `${160 + Math.random() * 280}deg`);

    clearTimeout(fireBurst._t);

  function runCoffeeDraw(exclude) {
    if (coffeeSpinning) return;
    cancelAnimationFrame(coffeeRaf);
    coffeeCard.classList.remove("win");
    coffeePeople.classList.remove("show");
    coffeeHint.classList.remove("show");
    coffeeBurst.innerHTML = "";
    coffeeDraw.hidden = true;

    if (!coffeeSuites.length) {
      coffeeReel.innerHTML = `<div class="coffee-reel-item"><div class="suite">—</div><div class="who">Brak mieszkań</div></div>`;
      setStatus("Brak mieszkań z mieszkańcami");
      setResultButtons(false);
      coffeeDraw.hidden = false;
      setCoffeeBusy(false);
      coffeeActions.classList.add("ready");
      return;
    }

    coffeePick = null;
    setCoffeeBusy(true);
    ensureAudio();
    buzz(12);

    const winner = pickCoffeeSuite(exclude);
    coffeeCard.classList.toggle("rekketun", isRekketun(winner.building));

    const lead = 18 + Math.floor(Math.random() * 8);
    const strip = [];
    for (let i = 0; i < lead; i++) strip.push(pickCoffeeSuite(null));
    strip.push(winner);
    // a couple after so the reel doesn't look empty past the window
    for (let i = 0; i < 3; i++) strip.push(pickCoffeeSuite(winner));

    const winnerIndex = lead;
    buildReel(strip, winnerIndex);

    const startY = REEL_PAD;
    const endY = REEL_PAD - winnerIndex * REEL_ITEM_H;
    const duration = 2200 + Math.random() * 600;
    const t0 = performance.now();
    let lastItem = -1;
    let phraseAt = 0;

    setStatus(SPIN_PHRASES[0]);
    coffeeReel.classList.add("blur");

    const step = now => {
      const raw = Math.min(1, (now - t0) / duration);
      const p = easeOutQuint(raw);
      const y = startY + (endY - startY) * p;
      coffeeReel.style.transform = `translate3d(0, ${y}px, 0)`;

      const item = Math.round((REEL_PAD - y) / REEL_ITEM_H);
      if (item !== lastItem && item >= 0 && item < strip.length) {
        lastItem = item;
        const speed = 1 - p;
        playTone(180 + speed * 220, 0.03, "square", 0.012 + speed * 0.02);
        if (speed > 0.15) buzz(8);
        coffeeCard.classList.toggle("rekketun", isRekketun(strip[item].building));
      }

      if (raw > phraseAt + 0.18 && raw < 0.9) {
        phraseAt = raw;
        const idx = Math.min(
          SPIN_PHRASES.length - 1,
          Math.floor(raw * SPIN_PHRASES.length),
        );
        setStatus(SPIN_PHRASES[idx]);
      }

      if (raw < 0.82) coffeeReel.classList.add("blur");
      else coffeeReel.classList.remove("blur");

      if (raw < 1) {
        coffeeRaf = requestAnimationFrame(step);
      } else {
        coffeeReel.style.transform = `translate3d(0, ${endY}px, 0)`;
        coffeeReel.classList.remove("blur");
        // tiny settle bounce
        const settleT0 = performance.now();
        const settle = t => {
          const s = Math.min(1, (t - settleT0) / 280);
          const bounce = Math.sin(easeOutCubic(s) * Math.PI) * 5 * (1 - s);
          coffeeReel.style.transform = `translate3d(0, ${endY + bounce}px, 0)`;
          if (s < 1) coffeeRaf = requestAnimationFrame(settle);
          else revealCoffee(winner);
        };
        coffeeRaf = requestAnimationFrame(settle);
      }
    };
    coffeeRaf = requestAnimationFrame(step);
  }

  function updateSelectionUI() {
    const s = shareItems.find(x => x.id === shareSelectedId);
    if (!s) {
      shareSelected.classList.remove("show");
      shareHandle.classList.remove("show");
      shareTrash.classList.remove("show");
      shareSize.classList.remove("show");
      return;
    }
    const rect = shareCanvas.getBoundingClientRect();
    const stage = shareStage.getBoundingClientRect();
    const scale = Math.min(rect.width / CW, rect.height / CH) || 1;
    const dispW = CW * scale;
    const dispH = CH * scale;
    const ox = rect.left - stage.left + (rect.width - dispW) / 2;
    const oy = rect.top - stage.top + (rect.height - dispH) / 2;
    const { hw, hh } = itemHalfSize(s);
    let w = hw * 2 * scale;
    let h = hh * 2 * scale;
    const minBox = 56;
    if (w < minBox) w = minBox;
    if (h < minBox) h = minBox;
    const left = ox + s.x * scale - w / 2;
    const top = oy + s.y * scale - h / 2;
    shareSelected.style.left = `${left}px`;
    shareSelected.style.top = `${top}px`;
    shareSelected.style.width = `${w}px`;
    shareSelected.style.height = `${h}px`;

  function seedCardItems(a) {
    shareItemId = 0;
    const gap = 40;
    const suiteHalfH = 70;
    const peopleCount = sharePeopleNames(a).length;
    const peopleHalfH = (28 + peopleCount * 40) / 2;
    const whenHalfH = 60;
    const bringHalfH = 60;
    const suiteY = sharePhoto ? CH * 0.52 : CH * 0.32;
    const peopleY = suiteY + suiteHalfH + gap + peopleHalfH;
    let whenY = peopleY + peopleHalfH + gap + whenHalfH;
    let bringY = whenY + whenHalfH + gap * 0.75 + bringHalfH;
    // jeśli za dużo osób — dociśnij kiedy/przynoszę niżej, ale w granicach karty
    const maxBring = CH - 70;
    if (bringY > maxBring) {
      const overflow = bringY - maxBring;
      whenY -= overflow * 0.45;
      bringY = maxBring;
    }
    shareItems = [
      {
        id: ++shareItemId,
        type: "suite",
        x: CW * 0.5,
        y: suiteY,
        scale: 1,
        rot: 0,
      },
      {
        id: ++shareItemId,
        type: "people",
        x: CW * 0.5,
        y: peopleY,
        scale: 1,
        rot: 0,
      },
      {
        id: ++shareItemId,
        type: "when",
        x: CW * 0.5,
        y: whenY,
        scale: 1,
        rot: 0,
        text: whenLabel(),
      },
      {
        id: ++shareItemId,
        type: "bring",
        x: CW * 0.5,
        y: bringY,
        scale: 1,
        rot: 0,
        text: shareBring,
      },
    ];
  }

  function drawCoverImage(img) {
    const ir = img.width / img.height;
    const cr = CW / CH;
    let dw, dh, dx, dy;
    if (ir > cr) {
      dh = CH;
      dw = CH * ir;
      dx = (CW - dw) / 2;
      dy = 0;
    } else {
      dw = CW;
      dh = CW / ir;
      dx = 0;
      dy = (CH - dh) / 2;
    }
    shareCtx.drawImage(img, dx, dy, dw, dh);
  }

  function drawItem(item, a) {

    } else if (item.type === "when") {

      shareCtx.font = "800 22px Archivo, system-ui, sans-serif";
      shareCtx.fillText("KIEDY", 0, text ? -22 : 0);
      if (text) {
        shareCtx.fillStyle = "#fff";
        shareCtx.font = "700 36px Archivo, system-ui, sans-serif";
        shareCtx.fillText(text, 0, 20);
      }
    } else if (item.type === "bring") {
      const text = (item.text || shareBring || "").trim();
      shareCtx.fillStyle = "rgba(1, 40, 38, .72)";
      const boxW = 560;
      const boxH = text ? 110 : 88;
      roundRect(shareCtx, -boxW / 2, -boxH / 2, boxW, boxH, 28);
      shareCtx.fill();
      shareCtx.fillStyle = "rgba(245,230,211,.85)";
      shareCtx.font = "800 22px Archivo, system-ui, sans-serif";
      shareCtx.fillText(isInviteMode() ? "PRZYNIEŚ" : "PRZYNOSZĘ", 0, text ? -22 : 0);
      if (text) {
        shareCtx.fillStyle = "#fff";
        shareCtx.font = "600 34px Archivo, system-ui, sans-serif";
        wrapTextCentered(shareCtx, text, 0, 18, boxW - 48, 36);
      }
    } else if (item.type === "text") {
      shareCtx.font = "800 54px Archivo, system-ui, sans-serif";
      const padX = 22;
      const tw = shareCtx.measureText(item.label).width;
      shareCtx.fillStyle = "rgba(1, 40, 38, .82)";
      roundRect(shareCtx, -tw / 2 - padX, -36, tw + padX * 2, 72, 36);
      shareCtx.fill();
      shareCtx.fillStyle = "#f5e6d3";
      shareCtx.fillText(item.label, 0, 2);
    } else if (item.type === "emoji") {
      shareCtx.font = "120px system-ui, Apple Color Emoji, Segoe UI Emoji, sans-serif";
      shareCtx.fillText(item.label, 0, 0);
    }
    shareCtx.restore();
  }

  function drawShareCard() {
    const a = shareSubject;
    shareCtx.clearRect(0, 0, CW, CH);

    if (sharePhoto) {
      drawCoverImage(sharePhoto);
      const g = shareCtx.createLinearGradient(0, CH * 0.32, 0, CH);
      g.addColorStop(0, "rgba(1,30,28,0)");
      g.addColorStop(0.4, "rgba(1,30,28,.5)");
      g.addColorStop(1, "rgba(1,24,22,.93)");
      shareCtx.fillStyle = g;
      shareCtx.fillRect(0, 0, CW, CH);
    } else {
      const rek = a && isRekketun(a.building);
      const g = shareCtx.createLinearGradient(0, 0, CW * 0.2, CH);
      if (rek) {
        g.addColorStop(0, "#5c3a22");
        g.addColorStop(0.55, "#8a4f1a");
        g.addColorStop(1, "#2a1a10");
      } else {
        g.addColorStop(0, "#014d49");
        g.addColorStop(0.55, "#0c625c");
        g.addColorStop(1, "#012826");
      }
      shareCtx.fillStyle = g;
      shareCtx.fillRect(0, 0, CW, CH);
      shareCtx.fillStyle = "rgba(255,255,255,.06)";
      shareCtx.beginPath();
      shareCtx.arc(CW * 0.8, CH * 0.18, 220, 0, Math.PI * 2);
      shareCtx.fill();
      shareCtx.beginPath();
      shareCtx.arc(CW * 0.15, CH * 0.7, 180, 0, Math.PI * 2);
      shareCtx.fill();
    }

    shareCtx.fillStyle = "rgba(255,255,255,.14)";
    roundRect(shareCtx, 64, 72, 420, 64, 32);
    shareCtx.fill();
    shareCtx.fillStyle = "#fff";
    shareCtx.font = "700 32px Archivo, system-ui, sans-serif";
    shareCtx.textAlign = "left";
    shareCtx.textBaseline = "alphabetic";
    shareCtx.fillText("Oslofjord — domki", 92, 114);

    for (const item of shareItems) drawItem(item, a);

    updateSelectionUI();
    updatePhotoChrome();
  }

  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function wrapText(ctx, text, x, y, maxW, lineH) {
    const words = text.split(" ");
    let line = "";
    let yy = y;
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, x, yy);
        line = word;
        yy += lineH;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, yy);
  }

  function wrapTextCentered(ctx, text, x, y, maxW, lineH) {
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    const start = y - ((lines.length - 1) * lineH) / 2;
    lines.forEach((ln, i) => ctx.fillText(ln, x, start + i * lineH));
  }

  function canvasMetrics() {
    const rect = shareCanvas.getBoundingClientRect();
    const scale = Math.min(rect.width / CW, rect.height / CH) || 1;
    const dispW = CW * scale;
    const dispH = CH * scale;
    return {
      rect,
      scale,
      ox: rect.left + (rect.width - dispW) / 2,
      oy: rect.top + (rect.height - dispH) / 2,
    };
  }

  function canvasPoint(clientX, clientY) {
    const m = canvasMetrics();
    return {
      x: (clientX - m.ox) / m.scale,
      y: (clientY - m.oy) / m.scale,
      scale: m.scale,
    };
  }

  function hitItem(x, y) {
    const pad = touchPadCanvas();
    for (let i = shareItems.length - 1; i >= 0; i--) {
      const s = shareItems[i];
      const { hw, hh } = itemHalfSize(s);
      const hitW = Math.max(hw, pad);
      const hitH = Math.max(hh, pad);
      if (Math.abs(x - s.x) <= hitW && Math.abs(y - s.y) <= hitH) return s;
    }
    return null;
  }

  function addSticker(def) {
    shareItemId += 1;
    const sticker = {
      id: shareItemId,
      type: def.kind,
      label: def.label,
      x: CW * (0.38 + Math.random() * 0.24),
      y: CH * (0.22 + Math.random() * 0.2),
      scale: 1.05 + Math.random() * 0.2,
      rot: (Math.random() - 0.5) * 0.28,
    };
    shareItems.push(sticker);
    selectItem(sticker.id);
    drawShareCard();
    buzz(10);
    playTone(660, 0.04, "triangle", 0.03);
    showShareTip("Przesuń · +/− · kosz");
  }

  async function loadSharePhoto(file) {
    if (!file) return;
    // iOS czasem oddaje pusty type dla HEIC po konwersji — próbuj i tak
    if (file.type && !file.type.startsWith("image/") && file.type !== "") {
      showShareToast("To nie wygląda na zdjęcie");
      return;
    }
    shareBusy = true;
    shareSend.disabled = true;
    showShareTip("Wczytuję zdjęcie…", 4000);
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, PHOTO_MAX / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * scale);
      const h = Math.round(bmp.height * scale);
      const off = document.createElement("canvas");
      off.width = w;
      off.height = h;
      const octx = off.getContext("2d");
      octx.drawImage(bmp, 0, 0, w, h);
      bmp.close?.();
      const img = new Image();
      const url = off.toDataURL("image/jpeg", 0.92);
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });
      sharePhoto = img;
      drawShareCard();
      updatePhotoChrome();
      buzz(12);
      showShareTip("Zdjęcie dodane");
      closeShareSheet();
    } catch {
      // fallback bez createImageBitmap
      const url = URL.createObjectURL(file);
      try {
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = url;
        });
        sharePhoto = img;
        drawShareCard();
        updatePhotoChrome();
        buzz(12);
        showShareTip("Zdjęcie dodane");
        closeShareSheet();
      } catch {
        showShareToast("Nie udało się wczytać zdjęcia");
      } finally {
        URL.revokeObjectURL(url);
      }
    } finally {
      shareBusy = false;
      shareSend.disabled = false;
    }
  }

      shareItems = [];

      shareBring = "";
      shareBringInput.value = "";
      shareDayKey = "";

      shareTimeCustom.value = "";

  async function exportShareBlob() {
    selectItem(null);
    drawShareCard();
    return new Promise((resolve, reject) => {
      shareCanvas.toBlob(
        blob => { if (blob) resolve(blob); else reject(new Error("blob")); },
        "image/jpeg",
        0.92,
      );
    });
  }

  async function sendShareInvite() {
    if (!shareSubject || shareBusy) return;
    closeShareSheet();
    shareBringInput.blur();
    shareBusy = true;
    shareSend.disabled = true;
    const prevLabel = shareSend.textContent;
    shareSend.textContent = "Chwilka…";
    const shareTitleText = isInviteMode() ? "Zaproszenie na kawę" : "Kawa u sąsiada";
    const fileName = isInviteMode() ? "zaproszenie-oslofjord.jpg" : "kawa-oslofjord.jpg";
    try {
      const blob = await exportShareBlob();
      const file = new File([blob], fileName, { type: "image/jpeg" });
      const text = inviteText(shareSubject);
      let shared = false;

      if (navigator.share) {
        const withFiles = { title: shareTitleText, text, files: [file] };
        const canFiles = !navigator.canShare || navigator.canShare({ files: [file] });
        try {
          if (canFiles) {
            await navigator.share(withFiles);
            shared = true;
          } else {
            await navigator.share({ title: shareTitleText, text });
            downloadBlob(blob, file.name);
            shared = true;
          }
        } catch (err) {
          if (err && err.name === "AbortError") {
            // cancelled — nic
          } else if (canFiles) {
            // niektóre WebView padają na files — spróbuj sam tekst + zapis
            try {
              await navigator.share({ title: shareTitleText, text });
            } catch { /* ignore */ }
            downloadBlob(blob, file.name);
            shared = true;
          } else {
            throw err;
          }
        }
      } else {
        downloadBlob(blob, file.name);
        shared = true;
        showShareToast("Zapisano obraz");
      }

      if (shared) {
        buzz([12, 30, 20]);
        playTone(784, 0.1, "sine", 0.04);
      }
    } catch {
      try {
        const blob = await exportShareBlob();
        downloadBlob(blob, fileName);
        showShareToast("Zapisano obraz");
      } catch {
        showShareToast("Nie udało się udostępnić");
      }
    } finally {
      shareBusy = false;
      shareSend.disabled = false;
      shareSend.textContent = prevLabel || (isInviteMode() ? "Wyślij zaproszenie" : "Udostępnij");
    }
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  renderStickerBar();
  shareStickerBar.addEventListener("click", e => {
    const btn = e.target.closest("button[data-i]");
    if (!btn) return;
    addSticker(shareStickerDefs[+btn.dataset.i]);
  });

  function clearLongPress() {
    clearTimeout(shareLongTimer);
    shareLongTimer = 0;
  }

  function onSharePointerDown(e) {
    if (!shareStudio.classList.contains("open")) return;
    if (e.target === shareTrash || e.target === shareHandle) return;
    if (e.target.closest("#shareSize")) return;
    if (shareActiveSheet) closeShareSheet();
    sharePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (sharePointers.size === 2) {
      clearLongPress();
      const pts = [...sharePointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const s = shareItems.find(x => x.id === shareSelectedId);
      sharePinch = { dist, scale0: s ? s.scale : 1 };
      shareDrag = null;
      return;
    }

    const p = canvasPoint(e.clientX, e.clientY);
    if (p.x < 0 || p.y < 0 || p.x > CW || p.y > CH) {
      selectItem(null);
      drawShareCard();
      return;
    }
    const hit = hitItem(p.x, p.y);
    shareMoved = false;
    if (!hit) {
      selectItem(null);
      drawShareCard();
      return;
    }
    e.preventDefault();
    selectItem(hit.id);
    shareItems = [...shareItems.filter(s => s.id !== hit.id), hit];
    shareDrag = {
      id: hit.id,
      ox: p.x - hit.x,
      oy: p.y - hit.y,
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
    };
    drawShareCard();
    try { shareStage.setPointerCapture(e.pointerId); } catch { /* ignore */ }

    clearLongPress();
    shareLongTimer = setTimeout(() => {
      if (!shareDrag || shareMoved) return;
      if (isDeletable(shareItems.find(x => x.id === shareSelectedId))) {
        deleteSelectedItem();
      }
      shareDrag = null;
    }, 700);
  }

  function onSharePointerMove(e) {
    if (!shareStudio.classList.contains("open")) return;
    if (sharePointers.has(e.pointerId)) {
      sharePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }

    if (shareResize && shareResize.pointerId === e.pointerId) {
      e.preventDefault();
      const s = shareItems.find(x => x.id === shareResize.id);
      if (!s) return;
      const p = canvasPoint(e.clientX, e.clientY);
      const dist = Math.hypot(p.x - s.x, p.y - s.y);
      const base = Math.max(40, shareResize.baseDist);
      s.scale = Math.max(0.4, Math.min(2.6, shareResize.scale0 * (dist / base)));
      drawShareCard();
      return;
    }

    if (sharePinch && sharePointers.size >= 2 && shareSelectedId != null) {
      e.preventDefault();
      const pts = [...sharePointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const s = shareItems.find(x => x.id === shareSelectedId);
      if (s && sharePinch.dist > 0) {
        s.scale = Math.max(0.4, Math.min(2.6, sharePinch.scale0 * (dist / sharePinch.dist)));
        drawShareCard();
      }
      return;
    }

    if (!shareDrag || shareDrag.pointerId !== e.pointerId) return;
    e.preventDefault();
    const dx = e.clientX - shareDrag.startX;
    const dy = e.clientY - shareDrag.startY;
    if (Math.hypot(dx, dy) > 14) {
      shareMoved = true;
      clearLongPress();
    }
    const p = canvasPoint(e.clientX, e.clientY);
    const s = shareItems.find(x => x.id === shareDrag.id);
    if (!s) return;
    s.x = Math.max(48, Math.min(CW - 48, p.x - shareDrag.ox));
    s.y = Math.max(48, Math.min(CH - 48, p.y - shareDrag.oy));
    drawShareCard();
  }

  function onSharePointerUp(e) {
    sharePointers.delete(e.pointerId);
    if (sharePointers.size < 2) sharePinch = null;
    clearLongPress();
    if (shareDrag && shareDrag.pointerId === e.pointerId) shareDrag = null;
    if (shareResize && shareResize.pointerId === e.pointerId) shareResize = null;
  }

  shareHandle.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
    const s = shareItems.find(x => x.id === shareSelectedId);
    if (!s) return;
    const p = canvasPoint(e.clientX, e.clientY);
    shareResize = {
      id: s.id,
      pointerId: e.pointerId,
      scale0: s.scale,
      baseDist: Math.max(40, Math.hypot(p.x - s.x, p.y - s.y)),
    };
    clearLongPress();
    try { shareHandle.setPointerCapture(e.pointerId); } catch { /* ignore */ }
  });
  shareHandle.addEventListener("pointermove", onSharePointerMove);
  shareHandle.addEventListener("pointerup", onSharePointerUp);
  shareHandle.addEventListener("pointercancel", onSharePointerUp);

  shareStage.addEventListener("pointerdown", onSharePointerDown);
  shareStage.addEventListener("pointermove", onSharePointerMove);
  shareStage.addEventListener("pointerup", onSharePointerUp);
  shareStage.addEventListener("pointercancel", onSharePointerUp);
  window.addEventListener("resize", () => {
    if (shareStudio.classList.contains("open")) updateSelectionUI();
  });

  renderBringChips();
  shareBringChips.addEventListener("click", e => {
    const btn = e.target.closest("button[data-v]");
    if (!btn) return;
    setBringText(btn.dataset.v === shareBring ? "" : btn.dataset.v);
    const bring = shareItems.find(i => i.type === "bring");
    if (bring) selectItem(bring.id);
  });
  shareBringInput.addEventListener("input", () => setBringText(shareBringInput.value));
  shareBringInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      shareBringInput.blur();
    }
  });

  shareDayChips.addEventListener("click", e => {
    const btn = e.target.closest("button[data-key]");
    if (!btn) return;
    setShareDay(btn.dataset.key, btn.dataset.label);
    const when = shareItems.find(i => i.type === "when");
    if (when) selectItem(when.id);
  });
  shareTimeChips.addEventListener("click", e => {
    const btn = e.target.closest("button[data-v]");
    if (!btn) return;
    setShareTime(btn.dataset.v);
    const when = shareItems.find(i => i.type === "when");
    if (when) selectItem(when.id);
  });
  shareTimeCustom.addEventListener("input", () => {
    const v = shareTimeCustom.value;
    setShareTime(v, true);
    const when = shareItems.find(i => i.type === "when");
    if (when) selectItem(when.id);
  });
  shareTimeCustom.addEventListener("change", () => {
    const v = shareTimeCustom.value;
    setShareTime(v, true);
  });

  for (const id of ["shareSmaller", "shareBigger"]) {
    const btn = document.getElementById(id);
    btn.addEventListener("pointerdown", e => e.stopPropagation());
    btn.addEventListener("click", e => {
      e.stopPropagation();
      nudgeSelectedScale(id === "shareSmaller" ? 0.88 : 1.14);
    });
  }

  shareDock.addEventListener("click", e => {
    const btn = e.target.closest("button[data-sheet]");
    if (!btn) return;
    openShareSheet(btn.dataset.sheet);
  });
  shareSheetClose.addEventListener("click", () => closeShareSheet());

  shareCameraBtn.addEventListener("click", () => {
    if (shareBusy) return;
    shareFileCam.click();
  });
  shareGalleryBtn.addEventListener("click", () => {
    if (shareBusy) return;
    shareFileGal.click();
  });
  shareClearPhoto.addEventListener("click", () => {
    sharePhoto = null;
    drawShareCard();
    updatePhotoChrome();
    showShareTip("Zdjęcie usunięte");
  });
  shareTrash.addEventListener("click", e => {
    e.stopPropagation();
    deleteSelectedItem();
  });
  shareFileCam.addEventListener("change", () => {
    const f = shareFileCam.files?.[0];
    shareFileCam.value = "";
    loadSharePhoto(f);
  });
  shareFileGal.addEventListener("change", () => {
    const f = shareFileGal.files?.[0];
    shareFileGal.value = "";
    loadSharePhoto(f);
  });
  shareBack.addEventListener("click", closeShareStudio);
  shareSend.addEventListener("click", sendShareInvite);

  coffeeBtn.addEventListener("click", openCoffee);
  coffeeDraw.addEventListener("click", () => runCoffeeDraw(null));
  coffeeAgain.addEventListener("click", () => runCoffeeDraw(coffeePick));
  coffeeShow.addEventListener("click", () => {
    if (!coffeePick) return;
    const a = coffeePick;
    const guest = a.residents[Math.floor(Math.random() * a.residents.length)];
    closeCoffee();
    setTimeout(() => goTo(a.building, a.apt, guest), 120);
  });
  coffeeShare.addEventListener("click", () => openShareStudio({ mode: "visit", subject: coffeePick }));
  coffeeClose.addEventListener("click", closeCoffee);
  coffeeOverlay.addEventListener("click", e => {
    if (e.target === coffeeOverlay && !shareStudio.classList.contains("open")) closeCoffee();
  });

  // ── zaproszenie — wybierz siebie i udostępnij ──
  const inviteBtn = document.getElementById("inviteBtn");
  const inviteOverlay = document.getElementById("inviteOverlay");
  const inviteCard = document.getElementById("inviteCard");
  const inviteStatus = document.getElementById("inviteStatus");
  const inviteSearch = document.getElementById("inviteSearch");
  const inviteSearchClear = document.getElementById("inviteSearchClear");
  const inviteList = document.getElementById("inviteList");
  const invitePicked = document.getElementById("invitePicked");
  const inviteWhoEl = document.getElementById("inviteWho");
  const inviteWhere = document.getElementById("inviteWhere");
  const inviteShare = document.getElementById("inviteShare");
  const inviteClose = document.getElementById("inviteClose");
  const INVITE_MEMORY_KEY = "oslofjord-invite-who";

  let invitePick = null; // { name, b, apt }
  let inviteHits = [];

  function loadInviteMemory() {
    try {
      const raw = localStorage.getItem(INVITE_MEMORY_KEY);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      if (!saved?.name || !saved?.b || !saved?.apt) return null;
      const match = PEOPLE.find(
        p => p.name === saved.name && p.b === saved.b && p.apt === saved.apt,
      );
      return match || null;
    } catch {
      return null;
    }
  }

  function saveInviteMemory(person) {
    try {
      localStorage.setItem(
        INVITE_MEMORY_KEY,
        JSON.stringify({ name: person.name, b: person.b, apt: person.apt }),
      );
    } catch { /* ignore */ }
  }

  function apartmentForPerson(person) {
    return APARTMENTS.find(a => a.building === person.b && a.apt === person.apt) || null;
  }

  function setInvitePick(person) {
    invitePick = person;
    if (!person) {
      invitePicked.classList.remove("show");
      inviteShare.disabled = true;
      inviteCard.classList.remove("rekketun");
      inviteStatus.textContent = "Kim jesteś?";
      inviteList.querySelectorAll(".invite-row").forEach(el => el.classList.remove("on"));
      return;
    }
    const flat = apartmentForPerson(person);
    const floor = person.apt.length === 3 ? ` · piętro ${person.apt[0]}` : "";
    inviteWhoEl.textContent = person.name;
    inviteWhere.textContent = `${bLabel(person.b)} · mieszkanie ${person.apt}${floor}`;
    invitePicked.classList.add("show");
    inviteShare.disabled = !flat;
    inviteCard.classList.toggle("rekketun", isRekketun(person.b));
    inviteStatus.textContent = "To Ty — gotowe do wysłania";
    inviteList.querySelectorAll(".invite-row").forEach(el => {
      const hit = inviteHits[+el.dataset.i];
      el.classList.toggle(
        "on",
        !!hit && hit.name === person.name && hit.b === person.b && hit.apt === person.apt,
      );
    });
    saveInviteMemory(person);
  }

  function renderInviteList(q = "") {
    const nq = norm(q.trim());
    inviteSearchClear.classList.toggle("show", !!q);
    const remembered = loadInviteMemory();
    let hits = PEOPLE
      .filter(r => !nq || matchesQuery(r, nq))
      .sort((a, b) => a.name.localeCompare(b.name, "pl"));

    if (!nq && remembered) {
      hits = [
        remembered,
        ...hits.filter(
          p => !(p.name === remembered.name && p.b === remembered.b && p.apt === remembered.apt),
        ),
      ];
    }
    hits = hits.slice(0, 40);
    inviteHits = hits;

    if (!hits.length) {
      inviteList.innerHTML = `<div class="invite-empty">Nie znaleziono „${q}”</div>`;
      return;
    }

    inviteList.innerHTML = hits.map((r, i) => {
      const badgeCls = isRekketun(r.b) ? "badge rekketun" : "badge";
      const addrPrefix = isRekketun(r.b) ? "Rekketun" : "Oslofjordveien";
      const isOn = invitePick
        && invitePick.name === r.name
        && invitePick.b === r.b
        && invitePick.apt === r.apt;
      const rememberedMark = remembered
        && remembered.name === r.name
        && remembered.b === r.b
        && remembered.apt === r.apt
        && !nq
        ? " · ostatnio"
        : "";
      return `<div class="invite-row${isOn ? " on" : ""}" data-i="${i}" role="option" aria-selected="${isOn}">
        <div class="${badgeCls}">
          <span class="bldg">${bShort(r.b)}</span>
          <span class="aptn">${r.apt}</span>
        </div>
        <div class="info">
          <div class="name">${r.name}</div>
          <div class="addr">${addrPrefix} ${bShort(r.b)} · mieszk. ${r.apt}${rememberedMark}</div>
        </div>
      </div>`;
    }).join("");
  }

  function resetInviteModal() {
    inviteSearch.value = "";
    const remembered = loadInviteMemory();
    invitePick = null;
    invitePicked.classList.remove("show");
    inviteShare.disabled = true;
    inviteCard.classList.remove("rekketun");
    inviteStatus.textContent = "Kim jesteś?";
    renderInviteList("");
    if (remembered) setInvitePick(remembered);
  }

  function openInvite() {
    if (coffeeOverlay.classList.contains("open")) {
      cancelAnimationFrame(coffeeRaf);
      coffeeOverlay.classList.remove("open", "closing");
      resetCoffeeModal();
      coffeeActions.classList.remove("ready");
    }
    resultsEl.classList.remove("open");
    input.blur();
    ensureAudio();
    inviteOverlay.classList.remove("closing");
    resetInviteModal();
    inviteOverlay.classList.add("open");
    inviteCard.style.animation = "none";
    void inviteCard.offsetWidth;
    inviteCard.style.animation = "";
    buzz(8);
    setTimeout(() => inviteSearch.focus(), 220);
  }

  function closeInvite() {
    if (shareStudio.classList.contains("open") && isInviteMode()) {
      closeShareStudio();
      return;
    }
    inviteOverlay.classList.add("closing");
    setTimeout(() => {
      inviteOverlay.classList.remove("open", "closing");
      inviteSearch.blur();
    }, 200);
  }

  function startInviteShare() {
    if (!invitePick) return;
    const flat = apartmentForPerson(invitePick);
    if (!flat) return;
    buzz(12);
    playTone(523.25, 0.07, "triangle", 0.04);
    openShareStudio({
      mode: "invite",
      subject: flat,
      personName: invitePick.name,
    });
  }

  inviteBtn.addEventListener("click", openInvite);
  inviteClose.addEventListener("click", closeInvite);
  inviteShare.addEventListener("click", startInviteShare);
  inviteSearch.addEventListener("input", () => renderInviteList(inviteSearch.value));
  inviteSearchClear.addEventListener("click", () => {
    inviteSearch.value = "";
    renderInviteList("");
    inviteSearch.focus();
  });
  inviteList.addEventListener("click", e => {
    const row = e.target.closest(".invite-row[data-i]");
    if (!row) return;
    const person = inviteHits[+row.dataset.i];
    if (!person) return;
    setInvitePick(person);
    buzz(10);
  });
  inviteOverlay.addEventListener("click", e => {
    if (e.target === inviteOverlay && !shareStudio.classList.contains("open")) closeInvite();
  });

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (shareStudio.classList.contains("open")) closeShareStudio();
    else if (inviteOverlay.classList.contains("open")) closeInvite();
    else if (coffeeOverlay.classList.contains("open")) closeCoffee();
  });
</script>
</body>
</html>
